name: Build and publish release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - os: ubuntu-24.04
            args: --ci --bundles deb rpm appimage
          - os: windows-latest
            args: --ci --bundles msi nsis
          - os: macos-latest
            args: --ci --target universal-apple-darwin --bundles dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require tag on matching branch and matching version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          case "$RELEASE_TAG" in
            *-*) BASE_BRANCH=pre-release ;;
            *)   BASE_BRANCH=main ;;
          esac
          git fetch origin "$BASE_BRANCH" --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD
          node <<'NODE'
          const fs = require('node:fs');
          const expected = process.env.RELEASE_TAG.slice(1);
          const packageVersion = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
          const tauriVersion = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8')).version;
          const cargoVersion = fs.readFileSync('src-tauri/Cargo.toml', 'utf8').match(/^version = "([^"]+)"/m)?.[1];
          const versions = [packageVersion, tauriVersion, cargoVersion];
          if (versions.some(version => version !== expected)) {
            throw new Error(`Tag ${expected} must match package, Tauri, and Cargo versions: ${versions.join(', ')}`);
          }
          NODE

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl file libayatana-appindicator3-dev libfuse2 libssl-dev libwebkit2gtk-4.1-dev libxdo-dev librsvg2-dev rpm wget

      - name: Install frontend dependencies
        run: npm ci

      - name: Install macOS build targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Arc ${{ github.ref_name }}"
          generateReleaseNotes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

  channel-pointer:
    needs: build
    if: contains(github.ref_name, '-')
    runs-on: ubuntu-24.04
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view beta --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create beta --repo "$GITHUB_REPOSITORY" --prerelease \
              --title "Beta channel" --notes "Points to the latest beta build."
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --pattern latest.json --output /tmp/latest.json --clobber
          gh release upload beta /tmp/latest.json --repo "$GITHUB_REPOSITORY" --clobber
