[package]
name = "arc"
version = "0.1.4-beta.2"
description = "A focused workspace for building the web"
authors = ["Arc"]
edition = "2021"

[lib]
name = "arc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-updater = "2"
portable-pty = "0.9"
notify-debouncer-full = "0.5"
ignore = "0.4"
keyring = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(target_os = "linux")'.dependencies]
window-vibrancy-wayland = { package = "window-vibrancy", git = "https://github.com/tauri-apps/window-vibrancy.git", rev = "0d2bf22b77318690b54a27fa0505437718fd69f6" }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
window-vibrancy = "0.8.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
